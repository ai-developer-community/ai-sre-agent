[project]
name = "ai-sre-agent"
version = "0.1.0"
description = "A local, evidence-first on-call agent for a Cloud Run shop"
requires-python = ">=3.12"
dependencies = [
  "claude-agent-sdk>=0.1.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "google-cloud-logging>=3.11,<4",
  "google-cloud-monitoring>=2.25,<3",
  "google-cloud-run>=0.10,<1",
  "google-cloud-pubsub>=2.28,<3",
  "google-auth>=2.38,<3",
  "pydantic-settings>=2.8,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "flask>=3.1,<4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
