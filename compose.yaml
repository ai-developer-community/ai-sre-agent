services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sre_demo
      POSTGRES_USER: sre_demo
      POSTGRES_PASSWORD: local-demo-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sre_demo -d sre_demo"]
      interval: 2s
      timeout: 2s
      retries: 15
volumes:
  postgres_data:
